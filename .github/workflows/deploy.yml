name: Deploy Frontend

on:
  push:
    branches: [main]
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  # Only one deploy runs at a time; cancel any in-progress run if a newer push arrives
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy-frontend:
    name: Build & Deploy to Azure SWA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          # Set in Repository → Settings → Secrets → Actions
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_ASSETS_BASE_URL: ${{ secrets.VITE_ASSETS_BASE_URL }}

      - name: Deploy to Azure Static Web Apps
        # Skip this step if the deploy token hasn't been set yet (before step 5.10)
        if: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Set in Repository → Settings → Secrets → Actions
          # Generated automatically when you create the Azure Static Web App (step 5.10)
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist
          # Build already ran above — skip Azure's built-in build step
          skip_app_build: true
