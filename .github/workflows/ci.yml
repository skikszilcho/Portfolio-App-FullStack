name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: Setup Node (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          # Placeholder value — CI only needs the build to succeed, not a real backend
          VITE_API_BASE_URL: http://localhost:5000
          VITE_ASSETS_BASE_URL: https://placeholder.r2.dev

      # ── Backend ──────────────────────────────────────────────────────────────
      - name: Setup Node (backend)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        # --if-present: no-op until backend/package.json has a "lint" script (5.11 step 3)
        run: npm run lint --if-present

      - name: Test backend
        working-directory: backend
        run: npm test
        env:
          LLM_PROVIDER: gemini
          LLM_API_KEY: ci-test-placeholder-key
          LLM_MODEL: gemini-2.5-flash-lite
